name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract project
    run: |
      ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
      test -n "$ZIP"
      mkdir source
      unzip -q "$ZIP" -d source
      find source \( -name settings.gradle.kts -o -name settings.gradle \)

  - name: Build APK
    run: |
      PROJECT=$(find source \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
      test -n "$PROJECT"
      cd "$(dirname "$PROJECT")"
      chmod +x gradlew 2>/dev/null || true
      if [ -f gradlew ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

  - uses: actions/upload-artifact@v4
    with:
      name: ConcertDungeon-APK
      path: source/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
