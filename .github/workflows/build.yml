
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Build APK
        shell: bash
        run: |
          PROJECT_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$PROJECT_FILE")"
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper gradlew not found"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConcertDungeon-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
