name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Find ZIP
    run: |
      ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
      if [ -z "$ZIP" ]; then echo "ZIP file not found"; exit 1; fi
      mkdir source
      unzip -q "$ZIP" -d source

  - name: Find Gradle project
    run: |
      find source -type f \( -name settings.gradle -o -name settings.gradle.kts \)

  - name: Build APK
    run: |
      PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
      if [ -z "$PROJECT_FILE" ]; then echo "Gradle project not found in ZIP"; exit 1; fi
      cd "$(dirname "$PROJECT_FILE")"
      if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug; else echo "Gradle wrapper not found"; exit 1; fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ConcertDungeon-APK
      path: source/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
